name: TestFlight

# Signs the app with the team's distribution certificate (managed automatically
# through an App Store Connect API key) and uploads the build to App Store Connect.
# The build then appears in TestFlight for internal testers (no App Review needed).
#
# Required repository settings (Settings → Secrets and variables → Actions):
#   Variables:  APPLE_TEAM_ID   e.g. AB12CD34EF
#               BUNDLE_ID       e.g. pl.amp3rrr.ecutweaker
#   Secrets:    ASC_KEY_ID      App Store Connect API key ID
#               ASC_ISSUER_ID   Issuer ID shown above the key list
#               ASC_KEY_P8      full contents of AuthKey_<KEY_ID>.p8

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  testflight:
    runs-on: macos-15
    if: ${{ vars.APPLE_TEAM_ID != '' && vars.BUNDLE_ID != '' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Install API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project EcuTweaker.xcodeproj -scheme EcuTweaker -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EcuTweaker.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            archive | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)"

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/EcuTweaker.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|upload"

      - name: Surface errors as annotations
        if: failure()
        run: |
          cat archive.log export.log 2>/dev/null | grep -E "error:|Error Domain|No Accounts|No profiles|requires a provisioning" \
            | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
